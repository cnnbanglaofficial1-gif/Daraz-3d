<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daraz 3D Store</title>
  <script src="https://tailwindcss.com"></script>
  <script src="https://cloudflare.com"></script>
  <style>
    body { background: #0b0b10; color: white; font-family: sans-serif; }
    .glass { background: rgba(255,255,255,0.06); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.12); }
    .card-3d { transition: 0.3s; }
    .card-3d:hover { transform: translateY(-6px); border-color: #f85606; }
  </style>
</head>
<body>

  <nav class="sticky top-0 z-50 bg-[#f85606] px-4 py-3 flex items-center justify-between gap-2">
    <div class="text-lg font-extrabold">DARAZ <span class="bg-black px-1.5 py-0.5 rounded text-xs">3D</span></div>
    <input id="searchInput" onkeyup="filterProducts()" type="text" placeholder="পণ্য খুঁজুন..." class="w-1/2 bg-white text-black rounded-full px-3 py-1 text-xs outline-none" />
    <button onclick="toggleCart()" class="bg-black/20 px-2.5 py-1 rounded-full text-sm">🛒 <span id="cartCount">0</span></button>
  </nav>

  <section class="max-w-5xl mx-auto px-4 py-6 flex flex-col md:flex-row items-center justify-between">
    <div class="space-y-2 text-center md:text-left">
      <span class="bg-[#f85606] text-xs font-bold px-2.5 py-1 rounded-full">3D Interactive Shop</span>
      <h1 class="text-3xl font-extrabold">কেনাকাটা করুন <span class="text-[#f85606]">3D</span> অভিজ্ঞতায়!</h1>
      <p class="text-gray-400 text-xs">3D অবজেক্টটি আঙুল দিয়ে ঘুরিয়ে দেখুন।</p>
    </div>
    <div id="canvas-container" class="w-full md:w-1/2 h-[220px] cursor-grab"></div>
  </section>

  <section class="max-w-5xl mx-auto px-4 pb-10">
    <h2 class="text-lg font-bold text-[#f85606] mb-4">⚡ ফ্ল্যাশ সেল (Flash Sale)</h2>
    <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>
  </section>

  <div id="cartModal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
    <div class="glass bg-[#16161f] w-full max-w-sm rounded-2xl p-4 space-y-3">
      <div class="flex justify-between font-bold border-b border-gray-700 pb-2">
        <span>শপিং কার্ট</span>
        <button onclick="toggleCart()">&times;</button>
      </div>
      <div id="cartItems" class="max-h-48 overflow-y-auto space-y-2 text-xs"></div>
      <div class="flex justify-between font-bold pt-2 border-t border-gray-700">
        <span>মোট:</span>
        <span class="text-[#f85606]">৳ <span id="totalPrice">0</span></span>
      </div>
      <button onclick="checkout()" class="w-full bg-[#f85606] py-2 rounded-lg font-bold text-xs">অর্ডার কনফার্ম করুন</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
